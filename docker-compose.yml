# Kumunita dev environment. Postgres mirrors the production Coolify addon: bootstrap
# superuser `postgres` (admin + restore only — the restore connects to it and targets
# the scratch/app database), plus a dedicated non-superuser app role `kumunita`
# created by dev-db-init/01-app-role.sql (dev credentials are weak-by-design; the app
# connection string and its host/port differ from prod by exactly those two things).
services:
  db:
    image: postgres:18
    container_name: kumunita_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    # Single mount at /var/lib/postgresql (NOT .../data): the 18+ image stores data in
    # major-version-specific subdirectories under the mount point (docker-library/postgres#37)
    # and refuses to start over a leftover layout with data directly at /var/lib/postgresql/data.
    volumes:
      - kumunita_pgdata:/var/lib/postgresql
      - ./dev-db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Probe as the bootstrap user — `kumunita` only exists once the init script
      # has run (i.e. after this healthcheck first passes), so it can't be the probe user.
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: kumunita_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

  app:
    build:
      context: .
    container_name: kumunita_app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Community__Name: "Kumunita Test Residents"
      Community__SupportEmail: "test@kumunita.com"
      # kumunita role (created by dev-db-init/01-app-role.sql), not the bootstrap superuser
      ConnectionStrings__Kumunita: "Host=db;Port=5432;Database=kumunita;Username=kumunita;Password=kumunita;Include Error Detail=true"
      # First-boot seed-admin lane (OPS §2). One-time, weak-by-design dev values (like the
      # DB password) — presented at /admin/setup on first boot to set the admin password;
      # the token is consumed and invalidated on that first use. Regenerate with
      # `openssl rand -hex 24` (or a fresh random hex string) if the DB volume is recreated.
      SeedAdmin__Email: "admin@kumunita.com"
      SeedAdmin__Token: "devseedadmintok30"
      # Mailpit as dev SMTP relay (COOLIFY §5.1A) — the only thing that gets the
      # first-boot setup email out; without it the outbox handler retries/dead-letters.
      # Inspect deliveries in the Mailpit web UI on port 8025.
      SMTP__Host: mailpit
      SMTP__Port: "1025"
      SMTP__Secure: "None"
      # Absolute base URL for links in outbound emails (verification link, etc.).
      # Must be the host-browser-reachable URL (this service's published port),
      # not the in-docker 8080 — the recipient opens the link in their own browser.
      Verification__BaseUrl: "http://localhost:5080"
      # Data-protection keyring (Program.cs:170-176, COOLIFY.md §5.2): without it
      # every `docker compose up --build` mints fresh keys and all cookies from
      # before the rebuild (session/antiforgery/Identity) can no longer be
      # decrypted — the "bounced back to login" bug. Same container path as the
      # production convention (Dockerfile VOLUME floor) so dev and prod agree.
      DataProtection__KeysDirectory: "/data/dataprotection-keys"
      # Media byte store (ADR 0011; OPS §4/§5 "second restore surface"): the
      # avatar bytes live on the named volume, not in Postgres (the dump
      # carries only the MediaObject catalog). Without this, MediaOptions
      # falls back to {BaseDirectory}/media inside the image layer and every
      # `docker compose up --build` loses the uploads — same discipline as the
      # keyring mount just above.
      Media__RootPath: "/data/media"
    ports:
      - "5080:8080"
    volumes:
      # Survives container recreation (unlike the image's VOLUME floor, whose
      # anonymous form can be pruned); only wiped by an explicit
      # `docker volume rm kumunita_dpkeys` or `docker compose down -v`.
      - kumunita_dpkeys:/data/dataprotection-keys
      # ADR 0011 second restore surface (OPS §4: snapshot beside its pg_dump;
      # §5: restore before the app starts). Same wipe caveat as kumunita_dpkeys.
      - kumunita_media:/data/media
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  kumunita_pgdata:
  kumunita_dpkeys:
  # Deduped avatar bytes (ADR 0011) — the app's second persistence surface.
  kumunita_media:
