# CI — a red test is a hard stop for `release` (the three pinned F14 gate commands, verbatim; F14 gate docs/design/prod-hardening-f14-ci.md).
# Rationale: ADR 0307 §D1 (branch flow, CI-on-release); xunit.v3 runner quirk: docs/dev/testing-and-ci.md.

name: CI

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release
  # Manual dispatch: the CI signal for a feature branch (branch-flow.md; ADR 0307 §D1).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token (SEC lane, U25): read-only — this workflow never pushes or writes.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # tag + commit-SHA pin (SEC L5 U25).
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # 10.0.400 matches global.json's sdk.version (xunit.v3 runner quirk: docs/dev/testing-and-ci.md).
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.400'

      # --- The three pinned gate commands (F14 pin §2, verbatim, in order) ---
      - name: Build
        run: dotnet build Kumunita.slnx -c Debug

      - name: Test Web
        run: dotnet exec tests/Kumunita.Web.Tests/bin/Debug/net10.0/Kumunita.Web.Tests.dll

      - name: Test Core
        run: dotnet exec tests/Kumunita.Core.Tests/bin/Debug/net10.0/Kumunita.Core.Tests.dll

  # IMPROVE-DOCS D14 — docs gate (Markdown layer only; no .NET build, no Docker).
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run docs gate
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/docs/docs-check.ps1

  # IMPROVE-UX X01 — report-only; prints the measurements table without gating PRs.
  ux-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Report UX measurements
        run: python3 tools/ux/ux-measure.py

  # IMPROVE-CODE C00 — code-size ratchet (Roslyn CodeMetrics tool + Node for ts metrics).
  code:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the ratchet reads the baseline off the PR's base ref.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.400'

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      # Unreadable base fails the gate under CI rather than being skipped (C00 ratchet).
      - name: Run code gate
        env:
          CODE_BASELINE_BASE: origin/${{ github.base_ref || 'release' }}
        run: pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/code/code-check.ps1

  # F19.U4 — E2E (Playwright vs the compose stack; precondition docs/design/prod-hardening-f19-e2e.md).
  e2e:
    runs-on: ubuntu-latest
    # The two env vars the E2E suite reads (F19 pin §1); the compose stack's published ports.
    env:
      KUMUNITA_APP_URL: http://localhost:5080
      KUMUNITA_MAILPIT_URL: http://localhost:8025
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Bring up the compose stack
        run: docker compose build app && docker compose up -d

      # App needs ~8 s after container start (Marten schema + Wolverine leadership).
      - name: Wait for app + Mailpit readiness
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 90 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -fsS "http://localhost:5080/health" >/dev/null 2>&1 \
              && curl -fsS "http://localhost:8025/api/v1/info" >/dev/null 2>&1; then
              echo "Readiness gate: app + Mailpit both 200"
              exit 0
            fi
            sleep 2
          done
          echo "Readiness gate: app or Mailpit did not answer within 90 s — wedged boot (precondition failure, not a test failure)" >&2
          exit 1

      # SIGNUP-GATE PRECONDITION (ADR 0050, F19 pin §6 #1): the suite asserts the gate is OPEN and fails fast if closed — the operator opens it; see docs/design/prod-hardening-f19-e2e.md.
      - name: Signup-gate precondition (documented)
        run: |
          echo "::notice::F19.E2E Flow A requires the ADR 0050 signup gate to be OPEN."
          echo "::notice::If the gate is closed, the suite fails fast with a named precondition message (it does not open the gate itself — pin §5 #5)."
          echo "::notice::Open the gate via the admin settings surface (SetSignupOpenAsync write lane) before this job can run Flow A green."
          echo "::notice::A 503 lockout in the suite is a precondition failure, never retried in a loop (pin §5 #6)."

      - name: Install E2E deps
        run: npm --prefix e2e ci

      # The Playwright npm package does not ship browser binaries (fresh runner).
      - name: Install Playwright browser
        run: npm --prefix e2e exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm --prefix e2e run test
